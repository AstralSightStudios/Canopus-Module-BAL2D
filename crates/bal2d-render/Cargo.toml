[package]
name = "bal2d-render"
description = "Turns a posed Spine skeleton into a draw list (no_std + alloc)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Paths as cluster outlines (the watch build: the real GC355 hung on long triangle-soup paths).
outline = []
# Host-only experiment switches (environment variables).
host = ["outline"]

[dependencies]
bal2d-spine = { path = "../bal2d-spine", default-features = false }
