[workspace]

[package]
name = "astrobox-plugin-bal2d-import"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63.0", features = ["async", "async-spawn"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
tracing = "0.1"
tracing-subscriber = "0.3"
bal2d-spine = { path = "../../crates/bal2d-spine" }
bal2d-pack = { path = "../../crates/bal2d-pack" }
bal2d-proto = { path = "../../crates/bal2d-proto" }
bal2d-compiler = { path = "../../crates/bal2d-compiler" }
bal2d-preview = { path = "../../crates/bal2d-preview" }
bal2d-core = { path = "../../crates/bal2d-core" }
bal2d-face = { path = "../../crates/bal2d-face" }
# gzip bodies of the online library's JSON tables (already in the tree through png).
flate2 = "1"

# Outgoing HTTP for the online library: raw wasi:http 0.2.12 bindings (the host links p2 http).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "2.0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
